name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StudentWebPortal/StudentWebPortal.csproj

      - name: Build
        run: dotnet build StudentWebPortal/StudentWebPortal.csproj --configuration Release --no-restore
